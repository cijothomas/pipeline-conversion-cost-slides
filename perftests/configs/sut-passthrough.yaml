# SUT: OTLP-in / OTLP-out passthrough. No processors.
# Pprof endpoint on :1777 so we can capture CPU profiles while load is running.

extensions:
  pprof:
    endpoint: 0.0.0.0:1777
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors: {}   # passthrough — measure pure conversion cost

exporters:
  # Sends to sink collector. otlphttp so the SUT pays a real proto encode
  # (using a non-debug exporter is the critical fix vs the Mar 1 profile).
  otlphttp:
    endpoint: http://localhost:5318
    # Disable retries and queueing so we measure steady-state, not buffering.
    retry_on_failure:
      enabled: false
    sending_queue:
      enabled: false
    compression: none
  # Optional alternate path if we want to test grpc instead of http.
  # otlp:
  #   endpoint: localhost:5317
  #   tls:
  #     insecure: true

service:
  extensions: [pprof, health_check]
  telemetry:
    metrics:
      level: none   # don't pollute the profile with self-metrics
  pipelines:
    logs:
      receivers: [otlp]
      processors: []
      exporters: [otlphttp]
    traces:
      receivers: [otlp]
      processors: []
      exporters: [otlphttp]
    metrics:
      receivers: [otlp]
      processors: []
      exporters: [otlphttp]
